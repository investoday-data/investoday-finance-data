name: Update API References

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      triggered_by:
        description: '触发来源（如 jenkins、manual）'
        required: false
        default: 'manual'

  # 北京时间每天 19:00 执行；GitHub Actions cron 使用 UTC，即 11:00 UTC。
  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: investoday-finance-data-release
  cancel-in-progress: false

jobs:
  update-references:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, using Python standard library only."
          fi

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC publishing support
        run: npm install -g npm@latest

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish pushed versions
        if: github.event_name == 'push'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_PUBLISH_TIMEOUT_SECONDS: '300'
        run: ./create/publish.sh --release-only --changelog "Automated release from push"

      - name: Publish docs release
        if: github.event_name != 'push'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_PUBLISH_TIMEOUT_SECONDS: '300'
        run: ./create/publish.sh --changelog "Automated scheduled docs release"
