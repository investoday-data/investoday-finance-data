name: Update API References

on:
  # 允许手动触发（GitHub UI / API / Jenkins 调用）
  workflow_dispatch:
    inputs:
      triggered_by:
        description: '触发来源（如 jenkins、manual）'
        required: false
        default: 'manual'

  # 北京时间每天 19:00 执行；GitHub Actions cron 使用 UTC，即 11:00 UTC。
  schedule:
    - cron: '0 11 * * *'

jobs:
  update-references:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 push 回 repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, using Python standard library only."
          fi

      - name: Generate references (fetch remote API spec)
        run: python create/generate_references.py --remote

      - name: Check for OpenAPI changes
        id: changes
        run: |
          git diff --quiet -- create/openapi.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Bump patch versions
        if: steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def bump_patch(version: str) -> str:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version.strip())
              if not match:
                  raise SystemExit(f"Unsupported version format: {version}")
              major, minor, patch = match.groups()
              return f"{major}.{minor}.{int(patch) + 1}"

          skill_path = Path("skills/SKILL.md")
          package_path = Path("package/investoday-api/package.json")

          skill_text = skill_path.read_text(encoding="utf-8")
          version_pattern = re.compile(r"(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$")
          match = version_pattern.search(skill_text)
          if not match:
              raise SystemExit("version field not found in skills/SKILL.md")
          old_skill = match.group(1)
          new_skill = bump_patch(old_skill)
          skill_path.write_text(version_pattern.sub(f"version: {new_skill}", skill_text, count=1), encoding="utf-8")

          package_json = json.loads(package_path.read_text(encoding="utf-8"))
          old_package = package_json["version"]
          new_package = bump_patch(old_package)
          package_json["version"] = new_package
          package_path.write_text(json.dumps(package_json, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"old_skill={old_skill}\n")
              output.write(f"new_skill={new_skill}\n")
              output.write(f"old_package={old_package}\n")
              output.write(f"new_package={new_package}\n")

          print(f"Skill version: {old_skill} -> {new_skill}")
          print(f"npm package version: {old_package} -> {new_package}")
          PY

      - name: Commit and push updated references
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            create/openapi.json \
            create/tree.json \
            package/investoday-api/data/openapi.json \
            package/investoday-api/data/tree.json \
            package/investoday-api/package.json \
            skills/SKILL.md \
            skills/docs/references-index.md \
            skills/docs/references-index.en.md \
            skills/references/
          git commit -m "release: docs ${{ steps.bump.outputs.new_skill }}"
          git pull --rebase origin main
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅ OpenAPI already up-to-date, nothing to commit."
